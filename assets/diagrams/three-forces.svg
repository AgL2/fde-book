<text x="230.0" y="251.0" font-size="12" font-weight="normal" font-style="normal" fill="#475569" text-anchor="middle">客户为「结果」付费，FDE 成为收入引擎</text>
<g filter="url(#ds)"><rect x="80" y="306" width="300" height="90" rx="8" fill="#F0F9FF" stroke="#0284C7" stroke-width="2"/></g>
<text x="230.0" y="347.0" font-size="14" font-weight="normal" font-style="normal" fill="#0F172A" text-anchor="middle">42 倍 / 供需比 0.28</text>
