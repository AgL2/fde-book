<text x="230.0" y="111.0" font-size="14" font-weight="normal" font-style="normal" fill="#0F172A" text-anchor="middle">MIT 95% 困局</text>
<text x="230.0" y="133.0" font-size="12" font-weight="normal" font-style="normal" fill="#475569" text-anchor="middle">模型能力过剩，落地能力短缺</text>
