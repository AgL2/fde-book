<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="480" viewBox="0 0 1160 480" font-family="'PingFang SC','Microsoft YaHei','Helvetica Neue',sans-serif">
<title>从结果出发：目标倒推链（12.1.2）</title>
<defs><filter id="ds" x="-10%" y="-10%" width="130%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter></defs>
<rect width="1160" height="480" fill="#FFFFFF"/>
<text x="40" y="32" font-size="18" font-weight="bold" font-style="normal" fill="#0F172A" text-anchor="start">从结果出发：目标倒推链（12.1.2）</text>
<rect x="840" y="60" width="280" height="320" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
<g filter="url(#ds)"><rect x="240" y="60" width="560" height="74" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/></g>
<text x="520.0" y="93.0" font-size="14" font-weight="bold" font-style="normal" fill="#0F172A" text-anchor="middle">目标公式</text>
<text x="520.0" y="115.0" font-size="12" font-weight="normal" font-style="normal" fill="#475569" text-anchor="middle">在 N 内，把 X 从 A 提升到 B，验收为 C（第 11 章产出物）</text>
<g filter="url(#ds)"><rect x="240" y="162" width="560" height="74" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/></g>
<text x="520.0" y="195.0" font-size="14" font-weight="bold" font-style="normal" fill="#0F172A" text-anchor="middle">关键假设</text>
<text x="520.0" y="217.0" font-size="12" font-weight="normal" font-style="normal" fill="#475569" text-anchor="middle">哪 3 个假设不成立，目标就必然失败？（技术可行性/数据可得/用户会真的用）</text>
<g filter="url(#ds)"><rect x="240" y="264" width="560" height="74" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/></g>
<text x="520.0" y="297.0" font-size="14" font-weight="bold" font-style="normal" fill="#0F172A" text-anchor="middle">最短验证路径</text>
<text x="520.0" y="319.0" font-size="12" font-weight="normal" font-style="normal" fill="#475569" text-anchor="middle">哪个最小实验能在两周内把最大的假设证实/证伪？</text>
<g filter="url(#ds)"><rect x="240" y="366" width="560" height="74" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/></g>
<text x="520.0" y="399.0" font-size="14" font-weight="bold" font-style="normal" fill="#0F172A" text-anchor="middle">排期</text>
<text x="520.0" y="421.0" font-size="12" font-weight="normal" font-style="normal" fill="#475569" text-anchor="middle">所有工作按「对验证路径的贡献」排序，而不是按「模块完整性」</text>
<path d="M520,150 L520,158" fill="none" stroke="#D97706" stroke-width="2" marker-end="url(#arr0)"/>
<path d="M520,252 L520,260" fill="none" stroke="#D97706" stroke-width="2" marker-end="url(#arr0)"/>
<path d="M520,354 L520,362" fill="none" stroke="#D97706" stroke-width="2" marker-end="url(#arr0)"/>
<path d="M800,270 L836,270" fill="none" stroke="#D97706" stroke-width="2" marker-end="url(#arr0)"/>
<text x="540" y="134" font-size="11" font-weight="normal" font-style="normal" fill="#D97706" text-anchor="start">倒推</text>
<text x="540" y="236" font-size="11" font-weight="normal" font-style="normal" fill="#D97706" text-anchor="start">倒推</text>
<text x="540" y="338" font-size="11" font-weight="normal" font-style="normal" fill="#D97706" text-anchor="start">倒推</text>
<text x="860" y="88" font-size="13" font-weight="bold" font-style="normal" fill="#0F172A" text-anchor="start">两个纪律</text>
<text x="860" y="116" font-size="12" font-weight="normal" font-style="normal" fill="#475569" text-anchor="start">假设显式化：不把「用户会真的用」</text>
<text x="860" y="140" font-size="12" font-weight="normal" font-style="normal" fill="#475569" text-anchor="start">写出来的团队，会在上线后才发现</text>
<text x="860" y="164" font-size="12" font-weight="normal" font-style="normal" fill="#475569" text-anchor="start">它是错的（MIT 95% 最常见死法）</text>
<text x="860" y="196" font-size="12" font-weight="normal" font-style="normal" fill="#475569" text-anchor="start">两周一个验证：从结果出发的项目，</text>
<text x="860" y="220" font-size="12" font-weight="normal" font-style="normal" fill="#475569" text-anchor="start">每两周都有一个「离 B 更近了</text>
<text x="860" y="244" font-size="12" font-weight="normal" font-style="normal" fill="#475569" text-anchor="start">多少」的数字</text>
<text x="860" y="276" font-size="12" font-weight="bold" font-style="normal" fill="#D97706" text-anchor="start">第 10 章评估</text>
<text x="860" y="300" font-size="12" font-weight="bold" font-style="normal" fill="#D97706" text-anchor="start">是它的仪表盘</text>
</svg>