<text x="930.0" y="232.0" font-size="11" font-weight="normal" font-style="normal" fill="#BE123C" text-anchor="middle">确认</text>
<path d="M840,130 L840,180 L180,180 L180,95 L236,95" fill="none" stroke="#BE123C" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#arr0)"/>
<rect x="500.0" y="101.5" width="76" height="18" fill="#FFFFFF"/>
<text x="538.0" y="116.5" font-size="11" font-weight="normal" font-style="normal" fill="#BE123C" text-anchor="middle">驳回·重跑</text>
<path d="M1040,365 L1056,365" fill="none" stroke="#BE123C" stroke-width="2" marker-end="url(#arr0)"/>
<text x="560" y="250" font-size="12" font-weight="bold" font-style="normal" fill="#BE123C" text-anchor="start">数据 2.5 天 → 6 分钟；报告 0.5 天 → 40 分钟；确认回写 → 2 小时</text>
<text x="560" y="155" font-size="11" font-weight="normal" font-style="italic" fill="#475569" text-anchor="middle">驳回循环限 3 次（max_steps=3 止损，第 5 章纪律）</text>
<text x="560" y="434" font-size="12" font-weight="normal" font-style="normal" fill="#475569" text-anchor="middle">设计点：查询参数带身份上下文；草稿与回写物理性隔离（HITL）；驳回循环限 3 次</text>
</svg>