<text x="350.0" y="82.0" font-size="14" font-weight="bold" font-style="normal" fill="#0F172A" text-anchor="middle">collect_data</text>
<text x="350.0" y="104.0" font-size="12" font-weight="normal" font-style="normal" fill="#475569" text-anchor="middle">调 ERP 工具：订单/回款</text>
<text x="350.0" y="122.0" font-size="12" font-weight="normal" font-style="normal" fill="#475569" text-anchor="middle">/客户三路查询</text>
<g filter="url(#ds)"><rect x="540" y="60" width="220" height="70" rx="8" fill="#FFF1F2" stroke="#BE123C" stroke-width="2"/></g>
<text x="650.0" y="82.0" font-size="14" font-weight="bold" font-style="normal" fill="#0F172A" text-anchor="middle">draft_report</text>
<text x="650.0" y="104.0" font-size="12" font-weight="normal" font-style="normal" fill="#475569" text-anchor="middle">组装结构化草稿</text>
<text x="650.0" y="122.0" font-size="12" font-weight="normal" font-style="normal" fill="#475569" text-anchor="middle">数字全部来自查询</text>
<g filter="url(#ds)"><rect x="820" y="60" width="220" height="70" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/></g>
