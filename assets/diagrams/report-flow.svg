<text x="930.0" y="361.0" font-size="14" font-weight="bold" font-style="normal" fill="#0F172A" text-anchor="middle">write_oa</text>
<text x="930.0" y="383.0" font-size="12" font-weight="normal" font-style="normal" fill="#475569" text-anchor="middle">回写 OA 并通知</text>
