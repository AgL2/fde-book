<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="520" viewBox="0 0 1160 520" font-family="'PingFang SC','Microsoft YaHei','Helvetica Neue',sans-serif">
<title>存量系统集成：通道决策树（16.1.3）</title>
<defs><filter id="ds" x="-10%" y="-10%" width="130%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter></defs>
<rect width="1160" height="520" fill="#FFFFFF"/>
<text x="40" y="32" font-size="18" font-weight="bold" font-style="normal" fill="#0F172A" text-anchor="start">存量系统集成：通道决策树（16.1.3）</text>
<rect x="820" y="60" width="300" height="130" rx="8" fill="#FFF1F2" stroke="#BE123C" stroke-width="2"/>
<rect x="820" y="230" width="300" height="150" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<rect x="80" y="470" width="1000" height="40" rx="8" fill="#FFF1F2" stroke="#BE123C" stroke-width="1.5"/>
<g filter="url(#ds)"><rect x="80" y="60" width="300" height="70" rx="8" fill="#FFF1F2" stroke="#BE123C" stroke-width="2"/></g>
<text x="230.0" y="100.0" font-size="14" font-weight="bold" font-style="normal" fill="#0F172A" text-anchor="middle">目标系统有正式 API 吗？</text>
<g filter="url(#ds)"><rect x="80" y="190" width="300" height="70" rx="8" fill="#FFF1F2" stroke="#BE123C" stroke-width="2"/></g>
<text x="230.0" y="230.0" font-size="14" font-weight="bold" font-style="normal" fill="#0F172A" text-anchor="middle">数据敏感性允许直连吗？</text>
<g filter="url(#ds)"><rect x="80" y="330" width="300" height="70" rx="8" fill="#FFF1F2" stroke="#BE123C" stroke-width="2"/></g>
<text x="230.0" y="370.0" font-size="14" font-weight="bold" font-style="normal" fill="#0F172A" text-anchor="middle">有人肉操作流程吗？</text>
<g filter="url(#ds)"><rect x="500" y="60" width="240" height="60" rx="8" fill="#FFF1F2" stroke="#BE123C" stroke-width="2"/></g>
<text x="620.0" y="95.0" font-size="14" font-weight="bold" font-style="normal" fill="#0F172A" text-anchor="middle">只读 API（首选）</text>
<g filter="url(#ds)"><rect x="500" y="190" width="240" height="60" rx="8" fill="#FFF1F2" stroke="#BE123C" stroke-width="2"/></g>
<text x="620.0" y="216.0" font-size="14" font-weight="bold" font-style="normal" fill="#0F172A" text-anchor="middle">中间库镜像</text>
<text x="620.0" y="238.0" font-size="12" font-weight="normal" font-style="normal" fill="#475569" text-anchor="middle">+ 权限过滤</text>
<g filter="url(#ds)"><rect x="500" y="300" width="240" height="70" rx="8" fill="#FFF1F2" stroke="#BE123C" stroke-width="2"/></g>
<text x="620.0" y="322.0" font-size="14" font-weight="bold" font-style="normal" fill="#0F172A" text-anchor="middle">半自动通道</text>
<text x="620.0" y="344.0" font-size="12" font-weight="normal" font-style="normal" fill="#475569" text-anchor="middle">定时导出 / 中间库</text>
<text x="620.0" y="362.0" font-size="12" font-weight="normal" font-style="normal" fill="#475569" text-anchor="middle">（webhook / 导出入口）</text>
<g filter="url(#ds)"><rect x="500" y="410" width="240" height="60" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/></g>
<text x="620.0" y="436.0" font-size="14" font-weight="bold" font-style="normal" fill="#0F172A" text-anchor="middle">RPA（最后手段）</text>
<text x="620.0" y="458.0" font-size="12" font-weight="normal" font-style="normal" fill="#475569" text-anchor="middle">标注脆弱性</text>
<path d="M380,95 L496,95" fill="none" stroke="#BE123C" stroke-width="2" marker-end="url(#arr0)"/>
<rect x="400.0" y="84.0" width="76" height="18" fill="#FFFFFF"/>
<text x="438.0" y="99.0" font-size="11" font-weight="normal" font-style="normal" fill="#BE123C" text-anchor="middle">有</text>
