<rect x="400.0" y="236.5" width="76" height="18" fill="#FFFFFF"/>
<text x="438.0" y="251.5" font-size="11" font-weight="normal" font-style="normal" fill="#BE123C" text-anchor="middle">敏感</text>
<path d="M380,365 L496,330" fill="none" stroke="#BE123C" stroke-width="2" marker-end="url(#arr0)"/>
<rect x="400.0" y="336.5" width="76" height="18" fill="#FFFFFF"/>
<text x="438.0" y="351.5" font-size="11" font-weight="normal" font-style="normal" fill="#BE123C" text-anchor="middle">有稳定入口</text>
<path d="M380,365 L496,440" fill="none" stroke="#BE123C" stroke-width="2" marker-end="url(#arr0)"/>
<rect x="400.0" y="391.5" width="76" height="18" fill="#FFFFFF"/>
<text x="438.0" y="406.5" font-size="11" font-weight="normal" font-style="normal" fill="#BE123C" text-anchor="middle">只有界面</text>
<path d="M230,130 L230,186" fill="none" stroke="#BE123C" stroke-width="2" marker-end="url(#arr0)"/>
<path d="M230,260 L230,326" fill="none" stroke="#BE123C" stroke-width="2" marker-end="url(#arr0)"/>
<path d="M230,330 L230,296" fill="none" stroke="#BE123C" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#arr0)"/>
<rect x="192.0" y="302.0" width="76" height="18" fill="#FFFFFF"/>
<text x="230.0" y="317.0" font-size="11" font-weight="normal" font-style="normal" fill="#BE123C" text-anchor="middle">敏感</text>
<text x="240" y="460" font-size="12" font-weight="normal" font-style="normal" fill="#475569" text-anchor="start"></text>
<text x="840" y="92" font-size="14" font-weight="bold" font-style="normal" fill="#BE123C" text-anchor="start">绝不：改客户存量系统</text>
<text x="840" y="120" font-size="12" font-weight="normal" font-style="normal" fill="#475569" text-anchor="start">那是「另外 4 个协调会」的地狱：</text>
<text x="840" y="146" font-size="12" font-weight="normal" font-style="normal" fill="#475569" text-anchor="start">ERP 改一个字段要走三个月变更流程</text>
<text x="840" y="258" font-size="13" font-weight="bold" font-style="normal" fill="#0F172A" text-anchor="start">宏达项目实选</text>
<text x="840" y="286" font-size="12" font-weight="normal" font-style="normal" fill="#475569" text-anchor="start">CRM 审批 4 周逼出中间库</text>
<text x="840" y="312" font-size="12" font-weight="normal" font-style="normal" fill="#475569" text-anchor="start">镜像 + 权限过滤（16.1.4</text>
<text x="840" y="338" font-size="12" font-weight="normal" font-style="normal" fill="#475569" text-anchor="start">有三个工程细节）</text>
<text x="580" y="494" font-size="12" font-weight="normal" font-style="normal" fill="#BE123C" text-anchor="middle">原则：只读优先、镜像次之、RPA 兜底——通道选择决定项目的集成风险敞口</text>
</svg>