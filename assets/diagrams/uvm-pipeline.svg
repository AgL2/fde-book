<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="420" viewBox="0 0 1160 420" font-family="'PingFang SC','Microsoft YaHei','Helvetica Neue',sans-serif">
<title>Verilog 用例主链路：先摘确定性果实（17.2.1）</title>
<defs><filter id="ds" x="-10%" y="-10%" width="130%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter></defs>
<rect width="1160" height="420" fill="#FFFFFF"/>
<text x="40" y="32" font-size="18" font-weight="bold" font-style="normal" fill="#0F172A" text-anchor="start">Verilog 用例主链路：先摘确定性果实（17.2.1）</text>
<rect x="60" y="220" width="1040" height="60" rx="8" fill="#FFF1F2" stroke="#BE123C" stroke-width="1.5"/>
<rect x="60" y="320" width="1040" height="60" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<g filter="url(#ds)"><rect x="60" y="80" width="170" height="84" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/></g>
<text x="145.0" y="118.0" font-size="14" font-weight="bold" font-style="normal" fill="#0F172A" text-anchor="middle">寄存器 Excel</text>
<text x="145.0" y="140.0" font-size="12" font-weight="normal" font-style="normal" fill="#475569" text-anchor="middle">解析·结构化</text>
<g filter="url(#ds)"><rect x="266" y="80" width="190" height="84" rx="8" fill="#FFF1F2" stroke="#BE123C" stroke-width="2"/></g>
<text x="361.0" y="109.0" font-size="14" font-weight="bold" font-style="normal" fill="#0F172A" text-anchor="middle">模板库</text>
<text x="361.0" y="131.0" font-size="12" font-weight="normal" font-style="normal" fill="#475569" text-anchor="middle">部门约定 → UVM 骨架</text>
<text x="361.0" y="149.0" font-size="12" font-weight="normal" font-style="normal" fill="#475569" text-anchor="middle">代码即翻译——零模型！</text>
<g filter="url(#ds)"><rect x="492" y="80" width="190" height="84" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/></g>
<text x="587.0" y="127.0" font-size="14" font-weight="bold" font-style="normal" fill="#0F172A" text-anchor="middle">生成测试序列</text>
<g filter="url(#ds)"><rect x="718" y="80" width="190" height="84" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/></g>
<text x="813.0" y="109.0" font-size="14" font-weight="bold" font-style="normal" fill="#0F172A" text-anchor="middle">评估</text>
<text x="813.0" y="131.0" font-size="12" font-weight="normal" font-style="normal" fill="#475569" text-anchor="middle">编译通过率 + 断言覆盖率</text>
<text x="813.0" y="149.0" font-size="12" font-weight="normal" font-style="normal" fill="#475569" text-anchor="middle">与人工样本对照</text>
<g filter="url(#ds)"><rect x="944" y="80" width="190" height="84" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/></g>
<text x="1039.0" y="109.0" font-size="14" font-weight="bold" font-style="normal" fill="#0F172A" text-anchor="middle">Agent 层</text>
<text x="1039.0" y="131.0" font-size="12" font-weight="normal" font-style="normal" fill="#475569" text-anchor="middle">第 5-7 章：处理开放需求</text>
<text x="1039.0" y="149.0" font-size="12" font-weight="normal" font-style="normal" fill="#475569" text-anchor="middle">「加异常注入」类</text>
<path d="M252,122 L262,122" fill="none" stroke="#BE123C" stroke-width="2" marker-end="url(#arr0)"/>
<path d="M478,122 L488,122" fill="none" stroke="#BE123C" stroke-width="2" marker-end="url(#arr0)"/>
<path d="M704,122 L714,122" fill="none" stroke="#BE123C" stroke-width="2" marker-end="url(#arr0)"/>
<path d="M930,122 L940,122" fill="none" stroke="#BE123C" stroke-width="2" marker-end="url(#arr0)"/>
<text x="80" y="246" font-size="13" font-weight="bold" font-style="normal" fill="#BE123C" text-anchor="start">主链路不用大模型：Excel → UVM 是纯代码翻译</text>
<text x="80" y="268" font-size="12" font-weight="normal" font-style="normal" fill="#475569" text-anchor="start">确定性转换交给模板，开放性增强才交给模型——评估基线因此出奇地高（编译通过率 95% 起步）</text>
<text x="80" y="346" font-size="13" font-weight="bold" font-style="normal" fill="#0F172A" text-anchor="start">黄金集 = 300 行真实寄存器 × 20 位工程师手写样本（脱敏）</text>
<text x="80" y="368" font-size="12" font-weight="normal" font-style="normal" fill="#475569" text-anchor="start">归因表直接变成模板库迭代清单：每个部门口头约定变成一条模板（17.2.3）</text>
</svg>