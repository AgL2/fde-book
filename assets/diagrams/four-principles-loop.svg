<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="460" viewBox="0 0 1160 460" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
    <marker id="aAmber" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <marker id="aAmberDash" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#B45309"/>
    </marker>
  </defs>

  <rect width="1160" height="460" fill="#FFFFFF"/>
  <text x="580" y="44" text-anchor="middle" font-size="18" font-weight="bold" fill="#0F172A">OpenAI 四原则：一个自洽的交付循环</text>

  <!-- 循环弧线（顺时针） -->
  <path d="M665,122 Q795,148 830,212" fill="none" stroke="#D97706" stroke-width="2" marker-end="url(#aAmber)"/>
  <path d="M832,304 Q800,382 662,404" fill="none" stroke="#D97706" stroke-width="2" marker-end="url(#aAmber)"/>
  <path d="M500,402 Q365,376 332,310" fill="none" stroke="#D97706" stroke-width="2" marker-end="url(#aAmber)"/>
  <path d="M330,218 Q358,140 498,116" fill="none" stroke="#D97706" stroke-width="2" marker-end="url(#aAmber)"/>

  <!-- 中心圆 -->
  <circle cx="580" cy="262" r="62" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="580" y="256" text-anchor="middle" font-size="13" font-weight="bold" fill="#475569">交付循环</text>
  <text x="580" y="276" text-anchor="middle" font-size="11" fill="#64748B">每转一圈</text>
  <text x="580" y="292" text-anchor="middle" font-size="11" fill="#64748B">目标更高</text>

  <!-- 节点①上 -->
  <rect x="505" y="84" width="150" height="52" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5" filter="url(#soft)"/>
  <text x="580" y="106" text-anchor="middle" font-size="13" font-weight="bold" fill="#0F172A">① 从结果出发</text>
  <text x="580" y="124" text-anchor="middle" font-size="10" fill="#64748B">定义可验收目标（11 章）</text>

  <!-- 节点③右 -->
  <rect x="760" y="236" width="150" height="52" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5" filter="url(#soft)"/>
  <text x="835" y="258" text-anchor="middle" font-size="13" font-weight="bold" fill="#0F172A">③ 补上智能缺口</text>
  <text x="835" y="276" text-anchor="middle" font-size="10" fill="#64748B">评估封闭缺口（10 章）</text>

  <!-- 节点②下 -->
  <rect x="505" y="386" width="150" height="52" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5" filter="url(#soft)"/>
  <text x="580" y="408" text-anchor="middle" font-size="13" font-weight="bold" fill="#0F172A">② 让成功可复制</text>
  <text x="580" y="426" text-anchor="middle" font-size="10" fill="#64748B">抽取 harness（14 章）</text>

  <!-- 节点④左 -->
  <rect x="250" y="236" width="150" height="52" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5" filter="url(#soft)"/>
  <text x="325" y="258" text-anchor="middle" font-size="13" font-weight="bold" fill="#0F172A">④ 去找更难的问题</text>
  <text x="325" y="276" text-anchor="middle" font-size="10" fill="#64748B">用资产追新能力</text>

  <!-- 攀升虚线 -->
  <path d="M628,212 Q790,150 940,86" fill="none" stroke="#B45309" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#aAmberDash)"/>
  <rect x="948" y="72" width="190" height="40" rx="8" fill="#FFFFFF" stroke="#CBD5E1" filter="url(#soft)"/>
  <text x="1043" y="88" text-anchor="middle" font-size="11" font-weight="bold" fill="#B45309">更难的问题 → 更高目标</text>
  <text x="1043" y="104" text-anchor="middle" font-size="10" fill="#64748B">螺旋上升，回到 ①</text>

  <!-- 底注 -->
  <text x="580" y="456" text-anchor="middle" font-size="11" font-style="italic" fill="#64748B">Palantir 对应：Eat pain（①③）→ excrete product（②）→ 用产品换更深的 pain（④）—— 缺一角即退化（正文 12.5）</text>
</svg>
