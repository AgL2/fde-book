<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="460" viewBox="0 0 1160 460" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
    <marker id="aGray" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#94A3B8"/>
    </marker>
    <marker id="aAmber" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#D97706"/>
    </marker>
  </defs>

  <rect width="1160" height="460" fill="#FFFFFF"/>
  <text x="580" y="44" text-anchor="middle" font-size="18" font-weight="bold" fill="#0F172A">1-2-30 交付节奏：信任的施工图（商汤「123 法则」）</text>

  <!-- 时间轴主线 -->
  <line x1="80" y1="252" x2="1076" y2="252" stroke="#94A3B8" stroke-width="3" marker-end="url(#aGray)"/>

  <!-- DAY 1 -->
  <circle cx="130" cy="252" r="8" fill="#D97706"/>
  <line x1="130" y1="244" x2="130" y2="200" stroke="#94A3B8" stroke-width="1.5"/>
  <rect x="60" y="140" width="140" height="56" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5" filter="url(#soft)"/>
  <text x="130" y="162" text-anchor="middle" font-size="12" font-weight="bold" fill="#0F172A">DAY 1 价值定义日</text>
  <text x="130" y="180" text-anchor="middle" font-size="10" fill="#64748B">一页纸价值定义书</text>

  <!-- DAY 2 -->
  <circle cx="260" cy="252" r="8" fill="#D97706"/>
  <line x1="260" y1="244" x2="260" y2="200" stroke="#94A3B8" stroke-width="1.5"/>
  <rect x="190" y="140" width="140" height="56" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5" filter="url(#soft)"/>
  <text x="260" y="162" text-anchor="middle" font-size="12" font-weight="bold" fill="#0F172A">DAY 2 Demo 验证日</text>
  <text x="260" y="180" text-anchor="middle" font-size="10" fill="#64748B">可点击 Demo + 三信号</text>

  <!-- W1-W4 周块 -->
  <rect x="330" y="228" width="110" height="48" rx="10" fill="#F0F9FF" stroke="#0284C7" stroke-width="1.5" filter="url(#soft)"/>
  <text x="385" y="249" text-anchor="middle" font-size="12" font-weight="bold" fill="#0F172A">W1 数据集成</text>
  <text x="385" y="266" text-anchor="middle" font-size="10" fill="#64748B">端到端跑通</text>

  <rect x="450" y="228" width="110" height="48" rx="10" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.5" filter="url(#soft)"/>
  <text x="505" y="249" text-anchor="middle" font-size="12" font-weight="bold" fill="#0F172A">W2 核心能力</text>
  <text x="505" y="266" text-anchor="middle" font-size="10" fill="#64748B">黄金集 + 基线报告</text>

  <!-- 缓冲 1（W2 末） -->
  <rect x="564" y="228" width="22" height="48" rx="6" fill="#CBD5E1" stroke="#94A3B8"/>

  <rect x="590" y="228" width="110" height="48" rx="10" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.5" filter="url(#soft)"/>
  <text x="645" y="249" text-anchor="middle" font-size="12" font-weight="bold" fill="#0F172A">W3 生产化</text>
  <text x="645" y="266" text-anchor="middle" font-size="10" fill="#64748B">四件套·权限·审计</text>

  <rect x="704" y="228" width="110" height="48" rx="10" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.5" filter="url(#soft)"/>
  <text x="759" y="249" text-anchor="middle" font-size="12" font-weight="bold" fill="#0F172A">W4 灰度验收</text>
  <text x="759" y="266" text-anchor="middle" font-size="10" fill="#64748B">验收报告 + 移交</text>

  <!-- 缓冲 2/3（W4 末） -->
  <rect x="818" y="228" width="22" height="48" rx="6" fill="#CBD5E1" stroke="#94A3B8"/>
  <rect x="842" y="228" width="22" height="48" rx="6" fill="#CBD5E1" stroke="#94A3B8"/>
  <text x="936" y="316" text-anchor="middle" font-size="10" fill="#64748B">■ 灰块 = 黑色 3 天缓冲（1+2 拆分）</text>

  <!-- DAY 30 旗帜 -->
  <circle cx="920" cy="252" r="8" fill="#D97706"/>
  <line x1="920" y1="244" x2="920" y2="180" stroke="#D97706" stroke-width="2"/>
  <path d="M920,180 L988,192 L920,204 Z" fill="#D97706" filter="url(#soft)"/>
  <text x="920" y="168" text-anchor="middle" font-size="12" font-weight="bold" fill="#B45309">DAY 30 上线</text>

  <!-- 上线报告会 -->
  <path d="M936,246 Q990,230 1032,196" fill="none" stroke="#B45309" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#aAmber)"/>
  <rect x="990" y="128" width="150" height="56" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5" filter="url(#soft)"/>
  <text x="1065" y="150" text-anchor="middle" font-size="12" font-weight="bold" fill="#0F172A">上线报告会</text>
  <text x="1065" y="168" text-anchor="middle" font-size="10" fill="#64748B">第 31-45 天，赶月度经营会</text>

  <!-- 每日 15 分钟标注 -->
  <text x="500" y="310" text-anchor="middle" font-size="10" fill="#64748B">每日 15 分钟对齐：断点 / 验证 / 依赖</text>

  <!-- 底注 -->
  <text x="580" y="448" text-anchor="middle" font-size="11" font-style="italic" fill="#64748B">缓冲写进公开排期、不提前用、没用完就是赚的 —— 从报警到恢复 ≤30 分钟、全程零「想起」（正文 13.4 / 第 9 章演练）</text>
</svg>
