<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="460" viewBox="0 0 1160 460" font-family="'PingFang SC','Microsoft YaHei','Helvetica Neue',sans-serif">
  <title>权限四道闸：串行校验，任何一道拦截即终止</title>
  <defs>
    <filter id="ds" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#0D9488"/>
    </marker>
    <marker id="arrow-rose" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#BE123C"/>
    </marker>
  </defs>
  <rect width="1160" height="460" fill="#FFFFFF"/>
  <text x="40" y="34" font-size="18" font-weight="bold" fill="#0F172A">权限四道闸：串行校验，任何一道拦截即终止</text>

  <!-- 主流程 -->
  <g filter="url(#ds)">
    <rect x="40" y="200" width="120" height="70" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/>
    <rect x="220" y="155" width="150" height="160" rx="10" fill="#F0FDFA" stroke="#0D9488" stroke-width="2"/>
    <rect x="400" y="155" width="150" height="160" rx="10" fill="#F0FDFA" stroke="#0D9488" stroke-width="2"/>
    <rect x="580" y="155" width="150" height="160" rx="10" fill="#F0FDFA" stroke="#0D9488" stroke-width="2"/>
    <rect x="760" y="155" width="150" height="160" rx="10" fill="#F0FDFA" stroke="#0D9488" stroke-width="2"/>
    <rect x="970" y="200" width="130" height="70" rx="8" fill="#CCFBF1" stroke="#0D9488" stroke-width="2"/>
  </g>
  <text x="100" y="228" font-size="13" fill="#0F172A" text-anchor="middle">用户请求</text>
  <text x="100" y="250" font-size="11" fill="#475569" text-anchor="middle">网关注入身份 claims</text>

  <text x="295" y="188" font-size="15" font-weight="bold" fill="#0F172A" text-anchor="middle">① 身份闸</text>
  <text x="295" y="232" font-size="13" fill="#0F172A" text-anchor="middle">你是谁？</text>
  <text x="295" y="268" font-size="11" fill="#475569" text-anchor="middle">SSO · LDAP 对接</text>
  <text x="295" y="288" font-size="11" fill="#475569" text-anchor="middle">不自己造身份</text>

  <text x="475" y="188" font-size="15" font-weight="bold" fill="#0F172A" text-anchor="middle">② 数据闸</text>
  <text x="475" y="232" font-size="13" fill="#0F172A" text-anchor="middle">能看哪些数据？</text>
  <text x="475" y="268" font-size="11" fill="#475569" text-anchor="middle">元数据过滤</text>
  <text x="475" y="288" font-size="11" fill="#475569" text-anchor="middle">第 8 章 filtered search</text>

  <text x="655" y="188" font-size="15" font-weight="bold" fill="#0F172A" text-anchor="middle">③ 工具闸</text>
  <text x="655" y="232" font-size="13" fill="#0F172A" text-anchor="middle">能用哪些工具？</text>
  <text x="655" y="268" font-size="11" fill="#475569" text-anchor="middle">MCP Server 白名单</text>
  <text x="655" y="288" font-size="11" fill="#475569" text-anchor="middle">最小权限（第 7 章）</text>

  <text x="835" y="188" font-size="15" font-weight="bold" fill="#0F172A" text-anchor="middle">④ 动作闸</text>
  <text x="835" y="232" font-size="13" fill="#0F172A" text-anchor="middle">以什么模式执行？</text>
  <text x="835" y="268" font-size="11" fill="#475569" text-anchor="middle">只读 · 草稿 · 执行</text>
  <text x="835" y="288" font-size="11" fill="#475569" text-anchor="middle">草稿两段式（第 7 章）</text>

  <text x="1035" y="228" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle">放行 · 执行</text>
  <text x="1035" y="250" font-size="11" fill="#475569" text-anchor="middle">全链路留 trace</text>

  <!-- 主流程箭头 -->
  <line x1="160" y1="235" x2="216" y2="235" stroke="#0D9488" stroke-width="2" marker-end="url(#arrow-teal)"/>
  <line x1="370" y1="235" x2="396" y2="235" stroke="#0D9488" stroke-width="2" marker-end="url(#arrow-teal)"/>
  <line x1="550" y1="235" x2="576" y2="235" stroke="#0D9488" stroke-width="2" marker-end="url(#arrow-teal)"/>
  <line x1="730" y1="235" x2="756" y2="235" stroke="#0D9488" stroke-width="2" marker-end="url(#arrow-teal)"/>
  <line x1="910" y1="235" x2="966" y2="235" stroke="#0D9488" stroke-width="2" marker-end="url(#arrow-teal)"/>

  <!-- 拦截支路 -->
  <line x1="295" y1="315" x2="295" y2="356" stroke="#BE123C" stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="475" y1="315" x2="475" y2="356" stroke="#BE123C" stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="655" y1="315" x2="655" y2="356" stroke="#BE123C" stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="835" y1="315" x2="835" y2="356" stroke="#BE123C" stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="295" y1="356" x2="835" y2="356" stroke="#BE123C" stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="580" y1="356" x2="580" y2="384" stroke="#BE123C" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow-rose)"/>
  <g filter="url(#ds)">
    <rect x="450" y="388" width="260" height="52" rx="8" fill="#FFF1F2" stroke="#BE123C" stroke-width="2"/>
  </g>
  <text x="580" y="410" font-size="14" font-weight="bold" fill="#BE123C" text-anchor="middle">拦截终止</text>
  <text x="580" y="430" font-size="11" fill="#BE123C" text-anchor="middle">403 · 记入审计日志</text>
</svg>
