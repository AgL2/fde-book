<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="320" viewBox="0 0 1160 320" font-family="'PingFang SC','Microsoft YaHei','Helvetica Neue',sans-serif">
<title>RAG 一句话流程（8.1.1）</title>
<defs><filter id="ds" x="-10%" y="-10%" width="130%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter></defs>
<rect width="1160" height="320" fill="#FFFFFF"/>
<text x="40" y="32" font-size="18" font-weight="bold" font-style="normal" fill="#0F172A" text-anchor="start">RAG 一句话流程（8.1.1）</text>
<rect x="80" y="210" width="1000" height="64" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<g filter="url(#ds)"><rect x="80" y="80" width="220" height="80" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="2"/></g>
<text x="190.0" y="116.0" font-size="14" font-weight="bold" font-style="normal" fill="#0F172A" text-anchor="middle">用户提问</text>
<text x="190.0" y="138.0" font-size="12" font-weight="normal" font-style="normal" fill="#475569" text-anchor="middle">「报销超标谁审批」</text>
<g filter="url(#ds)"><rect x="350" y="80" width="220" height="80" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="2"/></g>
<text x="460.0" y="116.0" font-size="14" font-weight="bold" font-style="normal" fill="#0F172A" text-anchor="middle">检索</text>
<text x="460.0" y="138.0" font-size="12" font-weight="normal" font-style="normal" fill="#475569" text-anchor="middle">从知识库找出最相关的片段</text>
<g filter="url(#ds)"><rect x="620" y="80" width="220" height="80" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="2"/></g>
<text x="730.0" y="116.0" font-size="14" font-weight="bold" font-style="normal" fill="#0F172A" text-anchor="middle">生成</text>
<text x="730.0" y="138.0" font-size="12" font-weight="normal" font-style="normal" fill="#475569" text-anchor="middle">把片段塞进上下文·根据资料回答</text>
<g filter="url(#ds)"><rect x="890" y="80" width="220" height="80" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="2"/></g>
<text x="1000.0" y="116.0" font-size="14" font-weight="bold" font-style="normal" fill="#0F172A" text-anchor="middle">溯源</text>
<text x="1000.0" y="138.0" font-size="12" font-weight="normal" font-style="normal" fill="#475569" text-anchor="middle">答案标注出自哪份文档哪一页</text>
<path d="M334,120 L346,120" fill="none" stroke="#0D9488" stroke-width="2" marker-end="url(#arr0)"/>
<path d="M604,120 L616,120" fill="none" stroke="#0D9488" stroke-width="2" marker-end="url(#arr0)"/>
<path d="M874,120 L886,120" fill="none" stroke="#0D9488" stroke-width="2" marker-end="url(#arr0)"/>
<text x="100" y="236" font-size="13" font-weight="bold" font-style="normal" fill="#0F172A" text-anchor="start">对比另两条知识注入路线</text>
<text x="100" y="260" font-size="12" font-weight="normal" font-style="normal" fill="#475569" text-anchor="start">微调：改模型「出厂知识」——贵、慢、易加剧幻觉；工具（Agent）：模型「自己去查」——灵活但慢。</text>
<text x="100" y="282" font-size="12" font-weight="normal" font-style="normal" fill="#475569" text-anchor="start">RAG 卡在中间：知识即时更新、答案可溯源、成本最低——企业问答标配的原因。</text>
</svg>