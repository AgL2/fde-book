<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="460" viewBox="0 0 1160 460" font-family="'PingFang SC','Microsoft YaHei','Helvetica Neue',sans-serif">
  <title>docker-compose 四件套</title>
  <defs>
    <filter id="ds" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#0D9488"/>
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#94A3B8"/>
    </marker>
  </defs>
  <rect width="1160" height="460" fill="#FFFFFF"/>
  <text x="40" y="32" font-size="18" font-weight="bold" fill="#0F172A">docker-compose 四件套：AI 系统的最小生产形态</text>

  <g filter="url(#ds)">
    <rect x="40" y="180" width="90" height="60" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/>
    <rect x="170" y="160" width="150" height="100" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="2"/>
    <rect x="380" y="90" width="170" height="100" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="2"/>
    <rect x="380" y="270" width="170" height="100" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="2"/>
    <rect x="640" y="125" width="150" height="70" rx="8" fill="#CCFBF1" stroke="#0D9488" stroke-width="2"/>
    <rect x="640" y="225" width="150" height="70" rx="8" fill="#CCFBF1" stroke="#0D9488" stroke-width="2"/>
    <rect x="640" y="325" width="150" height="70" rx="8" fill="#CCFBF1" stroke="#0D9488" stroke-width="2"/>
  </g>
  <text x="85" y="215" font-size="14" fill="#0F172A" text-anchor="middle">用户</text>

  <text x="245" y="196" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle">① gateway</text>
  <text x="245" y="220" font-size="11" fill="#475569" text-anchor="middle">路由 · 限流</text>
  <text x="245" y="240" font-size="11" fill="#475569" text-anchor="middle">鉴权 · TLS 终结</text>

  <text x="465" y="126" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle">② agent-api</text>
  <text x="465" y="150" font-size="11" fill="#475569" text-anchor="middle">LangGraph 图</text>
  <text x="465" y="170" font-size="11" fill="#475569" text-anchor="middle">+ MCP Client（6-7 章）</text>

  <text x="465" y="306" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle">③ rag-api</text>
  <text x="465" y="330" font-size="11" fill="#475569" text-anchor="middle">知识库 + 混合检索</text>
  <text x="465" y="350" font-size="11" fill="#475569" text-anchor="middle">（第 8 章）</text>

  <rect x="620" y="90" width="190" height="310" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="715" y="110" font-size="14" font-weight="bold" fill="#475569" text-anchor="middle">④ infra</text>

  <text x="715" y="152" font-size="13" font-weight="bold" fill="#0F172A" text-anchor="middle">vLLM 推理</text>
  <text x="715" y="176" font-size="11" fill="#475569" text-anchor="middle">GPU 密集</text>
  <text x="715" y="252" font-size="13" font-weight="bold" fill="#0F172A" text-anchor="middle">向量库</text>
  <text x="715" y="276" font-size="11" fill="#475569" text-anchor="middle">IO 密集</text>
  <text x="715" y="352" font-size="13" font-weight="bold" fill="#0F172A" text-anchor="middle">审计日志库</text>
  <text x="715" y="376" font-size="11" fill="#475569" text-anchor="middle">trace_id 落盘（9.4）</text>

  <!-- 主链路 -->
  <line x1="130" y1="210" x2="166" y2="210" stroke="#0D9488" stroke-width="2" marker-end="url(#arrow-teal)"/>
  <path d="M245,160 V140 H376" fill="none" stroke="#0D9488" stroke-width="2" marker-end="url(#arrow-teal)"/>
  <path d="M245,260 V320 H376" fill="none" stroke="#0D9488" stroke-width="2" marker-end="url(#arrow-teal)"/>
  <line x1="465" y1="190" x2="465" y2="266" stroke="#0D9488" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#arrow-teal)"/>
  <rect x="473" y="218" width="56" height="18" fill="#FFFFFF"/>
  <text x="501" y="231" font-size="11" fill="#0D9488">调用检索</text>

  <!-- 基建调用（虚线灰） -->
  <path d="M550,140 H636" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-gray)"/>
  <path d="M550,320 H636" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-gray)"/>
  <path d="M550,345 H600 V360 H636" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-gray)"/>
  <path d="M550,115 H600 V360 H636" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-gray)"/>

  <!-- 右侧注释 -->
  <g filter="url(#ds)">
    <rect x="840" y="90" width="280" height="170" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  </g>
  <text x="858" y="120" font-size="13" font-weight="bold" fill="#0F172A">边界的划分（四件套的意义）</text>
  <text x="858" y="150" font-size="12" fill="#475569">独立伸缩：推理 GPU 密集 · 检索 IO 密集</text>
  <text x="858" y="178" font-size="12" fill="#475569">独立升级：换 embedding 只动 rag-api</text>
  <text x="858" y="206" font-size="12" fill="#475569">独立观测：trace_id 按这个边界串</text>
  <g filter="url(#ds)">
    <rect x="840" y="290" width="280" height="60" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.5"/>
  </g>
  <text x="980" y="315" font-size="12" font-weight="bold" fill="#0D9488" text-anchor="middle">docker compose config —— 交付前必跑</text>
  <text x="980" y="336" font-size="11" fill="#0D9488" text-anchor="middle">（一条命令本地校验语法）</text>
</svg>
